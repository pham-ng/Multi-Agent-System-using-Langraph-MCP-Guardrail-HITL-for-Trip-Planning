services:
  - type: web
    name: tripmate-guardrail-hitl
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: OPEN_WEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HISTORY_ADMIN_TOKEN
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: APP_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_BACKEND
        value: postgres
      - key: JOB_WORKER_ENABLED
        value: "true"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: MCP_TOOL_TIMEOUT_SECONDS
        value: "45"
      - key: METRICS_TOKEN
        sync: false
      - key: PASSWORD_RESET_DEBUG
        value: "false"
      - key: PASSWORD_RESET_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: LLM_INPUT_COST_PER_1M_USD
        value: "0"
      - key: LLM_OUTPUT_COST_PER_1M_USD
        value: "0"
      - key: DEFAULT_ORIGIN_IATA
        value: SGN
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: TripMate-Guardrail-HITL
