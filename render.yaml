services:
  - type: web
    name: tripmate-guardrail-hitl
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: OPEN_WEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HISTORY_ADMIN_TOKEN
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: APP_SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: JOB_WORKER_ENABLED
        value: "true"
      - key: METRICS_TOKEN
        sync: false
      - key: DEFAULT_ORIGIN_IATA
        value: SGN
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: TripMate-Guardrail-HITL
