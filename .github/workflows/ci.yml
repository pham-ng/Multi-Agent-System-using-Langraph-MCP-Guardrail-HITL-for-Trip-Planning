name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q --tb=short
      - name: Compile checks
        run: python -m py_compile auth.py backend.py app.py mcp_client.py observability.py reliability.py job_worker.py scripts/smoke_async.py
      - name: Frontend syntax check
        run: node --check static/script.js
